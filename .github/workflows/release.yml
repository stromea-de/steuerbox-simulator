name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      mode:
        description: Build only; no release or attestation (also usable in a private staging repo)
        type: choice
        options: [build-only]
        default: build-only
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Resolve stable version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT" == push ]]; then
            [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            version="${REF_NAME#v}"
          else
            version=1.0.0
          fi
          test -f "docs/RELEASE_NOTES_${version}.md"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install verified GoReleaser OSS 2.20.0
        run: |
          bash scripts/install-goreleaser.sh "$RUNNER_TEMP/stromea-tools"
          echo "$RUNNER_TEMP/stromea-tools" >> "$GITHUB_PATH"
      - name: Go tests (simulators and loopback)
        run: go test ./...
      - name: Release boundary tests
        run: python3 scripts/test_release_ci.py
      - name: Build all platforms and verify checksums and binary version
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" == push ]]; then
            bash scripts/release-ci.sh tag
          else
            bash scripts/release-ci.sh snapshot
          fi
      - name: Stage exact release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          manifest="$RUNNER_TEMP/staging-manifest.txt"
          if ! python3 scripts/release-assets.py list dist "$VERSION" > "$manifest"; then
            echo 'Asset manifest generation failed' >&2
            exit 1
          fi
          assets=()
          while IFS= read -r asset; do assets+=("$asset"); done < "$manifest"
          if [[ ${#assets[@]} -ne 12 ]]; then
            echo 'Expected exactly 12 release assets' >&2
            exit 1
          fi
          mkdir "$RUNNER_TEMP/release-assets"
          for asset in "${assets[@]}"; do
            cp "$asset" "$RUNNER_TEMP/release-assets/"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Require intended public repository
        env:
          REPOSITORY: ${{ github.repository }}
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          [[ "$REPOSITORY" == stromea-de/steuerbox-simulator ]]
          [[ "$PRIVATE" == false ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets
      - name: Verify exact asset set before attesting
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python3 scripts/release-assets.py verify release-assets "$VERSION"
          test "$(find release-assets -type f | wc -l | tr -d ' ')" = 12
          (cd release-assets && shasum -a 256 -c SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*
      - name: Verify provenance for every asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in release-assets/*; do
            gh attestation verify "$asset" --repo stromea-de/steuerbox-simulator
          done
      - name: Create stable release after all checks
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          RELEASE_DRAFT: ${{ vars.RELEASE_DRAFT }}
        run: |
          manifest="$RUNNER_TEMP/release-manifest.txt"
          if ! python3 scripts/release-assets.py list release-assets "$VERSION" > "$manifest"; then
            echo 'Asset manifest generation failed' >&2
            exit 1
          fi
          assets=()
          while IFS= read -r asset; do assets+=("$asset"); done < "$manifest"
          options=()
          if [[ "$RELEASE_DRAFT" == true ]]; then options+=(--draft); fi
          if [[ ${#assets[@]} -ne 12 ]]; then
            echo 'Expected exactly 12 release assets' >&2
            exit 1
          fi
          gh release create "v$VERSION" --repo stromea-de/steuerbox-simulator \
            --verify-tag --title "Stromea Steuerbox-Simulator $VERSION" \
            --notes-file "docs/RELEASE_NOTES_${VERSION}.md" \
            "${options[@]}" "${assets[@]}"
